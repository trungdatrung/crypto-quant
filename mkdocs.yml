site_name: crypto-quant
site_description: Crypto price-direction prediction with classical ML and fee-aware walk-forward backtesting
site_url: https://the-daonm.github.io/crypto-quant/
repo_url: https://github.com/the-daonm/crypto-quant
repo_name: the-daonm/crypto-quant
edit_uri: edit/main/docs/
copyright: Released under the MIT License

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: index.md
  - Paper trading: paper-trading.md
  - API reference: api.md
  - Contributing: contributing.md
  - Changelog: changelog.md
  - Giải thích (Tiếng Việt): GIAI-THICH.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify { kwds: { case: lower } }
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true

validation:
  omitted_files: warn
  absolute_links: ignore
  unrecognized_links: warn
